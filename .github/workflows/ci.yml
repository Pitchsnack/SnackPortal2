name: ci
# Build Phase 1 — VALIDATION ONLY. No deployment, release, provisioning, or
# infrastructure automation is defined here (explicitly out of scope).
on:
  push:
  pull_request:

# Least-privilege default (ATR-S2): deny-by-default floor for any block-less job.
# Jobs that need more declare it explicitly (a job-level block REPLACES this default).
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dev tooling
        run: pip install .[dev]
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type-check (mypy)
        run: mypy .
      - name: Import boundaries + cycle detection (import-linter)
        run: lint-imports
      - name: Architecture tests (vendor/DB containment, traceability, hygiene)
        run: pytest tests/architecture
      - name: Full default test suite (PRD 06 B-7C-1; requires_pg excluded via addopts — no PostgreSQL)
        run: pytest

  secret-scan:
    runs-on: ubuntu-latest
    # Least-privilege, job-scoped. gitleaks-action@v2 reads PR commits via the
    # REST API on pull_request events; without pull-requests:read the call returns
    # 403 "Resource not accessible by integration". CI-config only.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret scan (gitleaks)
        # gitleaks/gitleaks-action v2.3.9 (commit ff98106e4c7b2bc287b24eaf42907196329070c7) pinned by SHA (ATR-S3)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          # Required by gitleaks-action@v2 to scan pull_request events
          # (push events do not require it). GitHub Actions auto-provided token;
          # not a stored/custom secret. CI-config only.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
