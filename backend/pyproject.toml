[project]
name = "snackportal2-backend"
version = "0.0.0"
description = "SnackPortal2 backend — Build Phase 1 scaffolding (no business logic, no contract behavior)."
# The FastAPI serving stack (fastapi / starlette / uvicorn / anyio) requires >=3.10, so the
# migration raises the runtime floor from 3.8 to 3.10. mypy's python_version now matches this
# floor exactly rather than sitting above it.
requires-python = ">=3.10"
# Runtime dependencies are added per build phase, kept minimal and vendor-neutral.
#   - Build Phase 3 adds portable JWT/JWKS validation (used only by the auth_router
#     SignatureVerifier provider under auth_router/adapters/providers; not a cloud SDK).
#   - Build Phase 4 adds a portable PostgreSQL driver, used ONLY by the database
#     drivers confined to database_router/adapters/providers/** (tenant serving) and
#     control_plane/adapters/providers/** (Control-DB persistence + verification probe).
#     Standard PostgreSQL only; not exercised by the stdlib test suite.
#   - The FastAPI migration adds the HTTP serving stack. FastAPI is imported by the nine
#     service edges under */adapters/providers/**; uvicorn is imported in exactly ONE place,
#     shared/adapters/providers/asgi_runtime.py, so the concrete ASGI server stays inside the
#     sanctioned containment zone. Both are open-source and vendor-neutral (ASGI is a standard
#     interface; neither ties the deployment to a cloud or a hosting provider), satisfying the
#     CLAUDE.md anti-vendor-lock-in constraint.
#   - Stage 6 adds httpx as a RUNTIME dependency. It was previously declared only under the
#     `dev` extra, described there as a test-only need of starlette's TestClient — but five
#     modules of the Option A rebuild import it to make their internal service-to-service
#     calls (bff/clients.py, shared/tenant_data.py, access_control/membership.py,
#     database_router/resolver.py, import_service/main.py). A `pip install .` therefore
#     produced a backend that could not call anything. It did not even fail closed: in every
#     one of those modules the `import httpx` sits *outside* the surrounding `try`, so the
#     ModuleNotFoundError escaped the fail-closed handler and surfaced as HTTP 500 rather than
#     the canonical denial. Proven by building the image and probing it (Stage 6 §19).
dependencies = [
  "pyjwt>=2",
  "cryptography",
  "psycopg[binary]>=3",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "mypy",
  "pytest",
  "import-linter",
  # httpx is NOT listed here any more. starlette's TestClient does need it, but so does the
  # running backend, and a dependency named only in the test extra is a dependency the
  # production install does not get. It now sits in `[project].dependencies` above, which the
  # `dev` install inherits — so the test need is still met, from the honest place.
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Flat multi-package layout: enumerate the seven runtime packages so setuptools
# auto-discovery never guesses (and never packages tests/). PRD-P6-V1-E1 F1.
[tool.setuptools.packages.find]
include = [
  "shared*",
  "api_gateway*",
  "auth_router*",
  "database_router*",
  "control_plane*",
  "import_service*",
  "lineage_service*",
  # The deployment composition root (D-44 / IC-012 sec.16): the ONE package permitted to compose more
  # than one service, and then only the narrow authorized set (import_service, database_router,
  # lineage_service, shared). It sits ABOVE them (it may import them; none may import it) and owns no
  # business logic.
  "deployment*",
  # The Option A clean rebuild (D-46): one namespace holding the shared technical
  # foundation and the fourteen independently-bootable FastAPI services. Kept separate
  # from the flat legacy packages above, which are Phase-0 category D and are neither
  # ported nor imported from here.
  "snackportal2*",
]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# `assert False, "..."` is the deliberate failure idiom of the stdlib-runnable
# standalone test runners (no pytest dependency at runtime). PRD-P6-V1-E1 F2.
"tests/**" = ["B011"]

[tool.ruff.format]
# The sanctioned live-PostgreSQL evidence harness must not be modified — not even
# reformatted (PRD-P6-V1-E1 §8: binding P6-V1 acceptance evidence). PRD-P6-V1-E1 F4a.
exclude = ["tests/lineage_service/requires_pg/*"]

[tool.mypy]
# Matches the runtime floor exactly (requires-python >=3.10, ruff target-version py310) since
# the FastAPI migration raised it; mypy no longer targets above the floor. PRD-P6-V1-E1 F3.
python_version = "3.10"
strict = true
ignore_missing_imports = true
# `pip install .[dev]` (the CI install step) leaves a setuptools build/ artifact
# in-tree; unlike ruff, mypy does not honor .gitignore and would see every
# package twice ("Duplicate module"). PRD-P6-V1-E1 F1/F3 co-requisite.
exclude = ["^build/"]

[[tool.mypy.overrides]]
# Tests are stdlib-runnable and deliberately lightly typed; strict typing is a
# production-code gate. PRD-P6-V1-E1 F3.
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
# The sanctioned DB-driver zones carry driver-version-dependent `# type: ignore`
# pins that strict's warn_unused_ignores would flag. PRD-P6-V1-E1 F3.
module = [
  "database_router.adapters.providers.*",
  "control_plane.adapters.providers.*",
]
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# requires_pg is the standalone-only live-PostgreSQL evidence harness (binding P6-V1
# acceptance evidence; its tests receive `conn`/`admin_dsn` from _pg.run(), not a pytest
# fixture). Run via `python tests/<svc>/requires_pg/test_pg_*.py` with SNACKPORTAL_TEST_DSN
# set. PRD-P6-V1-E1 F4a; D15 distinctness evidence per PRD-D15-IMPL-01 §13.
#
# tests/snackportal2/requires_pg is the Option A rebuild's Stage 4 live-PostgreSQL suite. It
# IS pytest-shaped (and clean-skips without its DSNs), but it is excluded from the default run
# for the same reason as its two predecessors: the default suite is hermetic, and a live suite
# that quietly reports "skipped" inside it is how live verification stops being noticed. It is
# run explicitly, against four disposable PostgreSQL clusters:
#     python -m pytest tests/snackportal2/requires_pg -q
addopts = """\
  --ignore=tests/lineage_service/requires_pg \
  --ignore=tests/control_plane/requires_pg \
  --ignore=tests/snackportal2/requires_pg\
"""

# --- Dependency boundaries (governance: dependency DAG, rules 1-2) ------------
[tool.importlinter]
root_packages = [
  "shared",
  "api_gateway",
  "auth_router",
  "database_router",
  "control_plane",
  "import_service",
  "lineage_service",
  # Analyzed so the composition root is POLICED, not merely unlisted: an unlisted package would be
  # invisible to the graph and could silently become a back-channel between two services. (IC-012 sec.13)
  "deployment",
  # The Option A rebuild. Analyzed so the old/new boundary and the service-independence
  # rule (IC-013 sec.13) are machine-enforced rather than merely intended.
  "snackportal2",
]

[[tool.importlinter.contracts]]
name = "shared is a dependency leaf (must not import any service)"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = [
  "api_gateway",
  "auth_router",
  "database_router",
  "control_plane",
  "import_service",
  "lineage_service",
]

[[tool.importlinter.contracts]]
name = "services are mutually independent (no service imports another)"
type = "independence"
modules = [
  "api_gateway",
  "auth_router",
  "database_router",
  "control_plane",
  "import_service",
  "lineage_service",
]

# The deployment composition root sits ABOVE the services it is authorized to compose: it may import
# them, but nothing may import IT. Without this contract the root would be a legal back-channel —
# service A could reach service B through it and the independence contract above would never see the
# chain. (IC-012 sec.4 / sec.13)
[[tool.importlinter.contracts]]
name = "nothing may import the deployment composition root (it is the top of the DAG)"
type = "forbidden"
source_modules = [
  "shared",
  "api_gateway",
  "auth_router",
  "database_router",
  "control_plane",
  "import_service",
  "lineage_service",
]
forbidden_modules = ["deployment"]

# The root's cross-service authority is EXHAUSTIVE, not general: Edge 9 requires import_service,
# database_router, lineage_service and shared, and nothing else. Forbidding the remaining three
# services makes the narrow grant machine-enforced, so widening it needs an IC-012 amendment
# (sec.5.1) rather than an unreviewed import. (IC-012 sec.3 / sec.13)
[[tool.importlinter.contracts]]
name = "the deployment root may compose only the authorized Edge 9 services"
type = "forbidden"
source_modules = ["deployment"]
forbidden_modules = [
  "api_gateway",
  "auth_router",
  "control_plane",
]

# --- Option A rebuild boundaries (D-46 / IC-013 sec.13) -----------------------
# Three properties are made machine-enforced here, because each is the kind of thing that
# holds on day one by intention and erodes later by convenience.

[[tool.importlinter.contracts]]
# D-46 classifies the flat packages above as category D — "old architecture, do not port".
# Retaining them on disk is only safe while nothing new can reach them: a single import
# would drag the retired Gateway-era runtime back into the target architecture through the
# side door, and the zero-Gateway census would still read zero.
name = "the Option A rebuild must not import the retired architecture"
type = "forbidden"
source_modules = ["snackportal2"]
forbidden_modules = [
  "api_gateway",
  "auth_router",
  "database_router",
  "control_plane",
  "import_service",
  "lineage_service",
  "shared",
  "deployment",
]

[[tool.importlinter.contracts]]
name = "the retired architecture must not import the Option A rebuild"
type = "forbidden"
source_modules = [
  "api_gateway",
  "auth_router",
  "database_router",
  "control_plane",
  "import_service",
  "lineage_service",
  "shared",
  "deployment",
]
forbidden_modules = ["snackportal2"]

[[tool.importlinter.contracts]]
# The shared foundation is technical only: config, errors, logging, correlation, security
# types, primitives. If it could import a service it could acquire a domain rule, and the
# "no tenant business rules in shared" boundary would be prose rather than structure.
name = "the rebuild's shared foundation is a dependency leaf"
type = "forbidden"
source_modules = ["snackportal2.shared"]
forbidden_modules = ["snackportal2.services"]

[[tool.importlinter.contracts]]
# IC-013 sec.13: a service MUST NOT import another service's internal implementation. The
# services talk over declared transport, which is what keeps them independently bootable
# and independently deployable — and what keeps the BFF from becoming an in-process monolith
# that merely looks like fourteen services.
name = "the fourteen rebuild services are mutually independent"
type = "independence"
modules = [
  "snackportal2.services.bff",
  "snackportal2.services.authentication",
  "snackportal2.services.access_control",
  "snackportal2.services.control_plane",
  "snackportal2.services.database_router",
  "snackportal2.services.startups",
  "snackportal2.services.investors",
  "snackportal2.services.deals",
  "snackportal2.services.sharing",
  "snackportal2.services.import_service",
  "snackportal2.services.lineage",
  "snackportal2.services.contacts",
  "snackportal2.services.ai_agents",
  "snackportal2.services.audit",
]
